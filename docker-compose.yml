services:
  bentopdf:
    image: ghcr.io/alam00000/bentopdf-simple:latest
    networks:
      nginx:
        ipv4_address: 172.22.0.80
    container_name: bentopdf
    restart: unless-stopped
    # For IPv4-only environments
    environment:
      - DISABLE_IPV6=true
networks:
  nginx:
    name: 'Nginx-network'
    external: true
